name: Deploy Verbalyst

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VERBALYST_DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: Deploy para o Droplet
        run: |
          ssh root@${{ secrets.DROPLET_IP }} << EOF
            export APP_ENV="${{ vars.APP_ENV }}"
            export VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}"
            export CORS_ORIGINS="${{ vars.CORS_ORIGINS }}"

            export POSTGRES_DB="${{ vars.POSTGRES_DB }}"
            export POSTGRES_USER="${{ vars.POSTGRES_USER }}"
            export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
            export POSTGRES_HOST="${{ vars.POSTGRES_HOST }}"
            export POSTGRES_PORT="${{ vars.POSTGRES_PORT }}"
            export DATABASE_URL="${{ secrets.DATABASE_URL }}"

            export OAUTH_CLIENT_ID="${{ secrets.OAUTH_CLIENT_ID }}"
            export OAUTH_CLIENT_SECRET="${{ secrets.OAUTH_CLIENT_SECRET }}"
            export OAUTH_REDIRECT_URI="${{ secrets.OAUTH_REDIRECT_URI }}"

            export JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}"
            export JWT_ALGORITHM="${{ vars.JWT_ALGORITHM }}"
            export JWT_EXPIRE_MINUTES="${{ vars.JWT_EXPIRE_MINUTES }}"

            cd /root/verbalyst
            git pull origin deploy
            docker compose down
            docker compose build
            docker compose up -d
          EOF
